name: build

on:
  push:
    branches:
      - master
    paths:
      - srcpkgs/librewolf/**
      - .github/workflows/main.yml
      - .github/scripts/**
  workflow_dispatch:

concurrency:
  group: librewolf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ vars.LIBREWOLF_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      XBPS_TARGET_ARCH: x86_64-musl
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_VERSION: "librewolf-x86_64-musl-skylake-v1"
      LIBREWOLF_PGO_CACHE_VERSION: "v5"
    steps:
      - name: free space
        run: |
          set -euo pipefail
          available_kib=$(df --output=avail -k / | tail -1 | tr -d " ")
          if [ "$available_kib" -lt $((60 * 1024 * 1024)) ]; then
            echo "Less than 60 GiB available; reclaiming runner disk space..."
            sudo rm -rf -- \
              /usr/share/dotnet \
              /usr/share/swift \
              /usr/local/lib/android \
              /opt/ghc \
              /usr/local/.ghcup \
              /usr/local/share/boost \
              /usr/local/graalvm \
              /usr/local/share/powershell \
              /usr/local/share/chromium \
              /usr/local/lib/node_modules
            if command -v docker >/dev/null 2>&1; then
              sudo docker image prune --all --force
            fi
          else
            echo "Skipping runner cleanup; sufficient free space is already available."
          fi
          df -h /

      - name: checkout librewolf-void
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: checkout void-packages
        uses: actions/checkout@v7
        with:
          repository: void-linux/void-packages
          ref: master
          path: void-packages
          persist-credentials: false

      - name: overlay LibreWolf package into void-packages
        run: |
          set -euo pipefail
          rm -rf void-packages/srcpkgs/librewolf
          cp -a srcpkgs/librewolf void-packages/srcpkgs/librewolf

      - name: validate and prepare package metadata
        id: meta
        run: |
          set -euo pipefail
          bash .github/scripts/validate-template.sh srcpkgs/librewolf/template

      - name: restore LibreWolf PGO profile
        id: pgo-cache
        uses: actions/cache/restore@v6
        with:
          path: void-packages/hostdir/pgo-cache
          # PGO validity follows source + downstream patches + this explicit version.
          # Bump LIBREWOLF_PGO_CACHE_VERSION when profile-relevant build/workload inputs change.
          key: librewolf-pgo-${{ env.LIBREWOLF_PGO_CACHE_VERSION }}-${{ steps.meta.outputs.sha256 }}-${{ hashFiles('srcpkgs/librewolf/template', 'srcpkgs/librewolf/patches/**', '.github/workflows/main.yml', 'void-packages/srcpkgs/llvm22/template', 'void-packages/srcpkgs/rust/template', 'void-packages/srcpkgs/wasi-sdk/template', 'void-packages/srcpkgs/rust-sccache/template', 'void-packages/srcpkgs/base-chroot/template') }}

      - name: prepare xbps-static
        run: |
          set -euo pipefail
          mkdir -p /opt/xbps
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 300 \
            --output xbps-static-latest.x86_64-musl.tar.xz \
            https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz
          tar -xJf xbps-static-latest.x86_64-musl.tar.xz -C /opt/xbps
          rm -f xbps-static-latest.x86_64-musl.tar.xz

      - name: install PGO Wayland compositor
        if: ${{ steps.pgo-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          if ! command -v sway >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends sway
          fi

      - name: allow xbps user namespaces
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: restore Void binary package cache
        id: xbps-cache
        uses: actions/cache/restore@v6
        with:
          path: void-packages/hostdir/repocache-${{ env.XBPS_TARGET_ARCH }}
          key: void-repocache-v1-${{ env.XBPS_TARGET_ARCH }}-${{ hashFiles('void-packages/xbps-src', 'void-packages/srcpkgs/base-chroot/template') }}

      - name: bootstrap xbps-src
        timeout-minutes: 15
        working-directory: void-packages
        run: |
          set -euo pipefail
          export PATH="/opt/xbps/usr/bin/:$PATH"
          ./xbps-src -A "$XBPS_TARGET_ARCH" binary-bootstrap

      - name: save Void binary package cache
        if: ${{ steps.xbps-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: void-packages/hostdir/repocache-${{ env.XBPS_TARGET_ARCH }}
          key: void-repocache-v1-${{ env.XBPS_TARGET_ARCH }}-${{ hashFiles('void-packages/xbps-src', 'void-packages/srcpkgs/base-chroot/template') }}

      - name: prepare sccache environment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const cacheUrl = process.env.ACTIONS_RESULTS_URL;
            const runtimeToken = process.env.ACTIONS_RUNTIME_TOKEN;
            if (!cacheUrl || !runtimeToken) {
              throw new Error("GitHub Actions cache runtime credentials are unavailable");
            }

            core.setSecret(runtimeToken);

            const quote = (value) => "'" + value.replaceAll("'", "'\"'\"'") + "'";
            const envFile = path.join(
              process.env.GITHUB_WORKSPACE,
              "void-packages",
              "hostdir",
              "sccache-env",
            );

            fs.writeFileSync(
              envFile,
              [
                `export SCCACHE_GHA_ENABLED=${quote(process.env.SCCACHE_GHA_ENABLED)}`,
                `export SCCACHE_GHA_VERSION=${quote(process.env.SCCACHE_GHA_VERSION)}`,
                `export ACTIONS_RESULTS_URL=${quote(cacheUrl)}`,
                `export ACTIONS_RUNTIME_TOKEN=${quote(runtimeToken)}`,
                "export SCCACHE_MULTILEVEL_CHAIN=disk,gha",
                "export SCCACHE_MULTILEVEL_WRITE_ERROR_POLICY=ignore",
              ].join("\n") + "\n",
              { mode: 0o600 },
            );
            fs.chmodSync(envFile, 0o600);
            core.info(`prepared ${envFile}`);

      - name: restore LibreWolf source
        id: source-cache
        uses: actions/cache/restore@v6
        with:
          path: void-packages/hostdir/sources/librewolf-${{ steps.meta.outputs.version }}/${{ steps.meta.outputs.distfile }}
          key: librewolf-source-v4-${{ steps.meta.outputs.sha256 }}

      - name: fetch and verify LibreWolf source
        timeout-minutes: 20
        working-directory: void-packages
        env:
          DISTFILE: ${{ steps.meta.outputs.distfile }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
        run: |
          set -euo pipefail
          export PATH="/opt/xbps/usr/bin/:$PATH"
          srcdir="hostdir/sources/librewolf-${VERSION}"
          distfile="${srcdir}/${DISTFILE}"
          mkdir -p "$srcdir"

          cache_valid=false
          if [ "${{ steps.source-cache.outputs.cache-hit }}" = "true" ] && [ -s "$distfile" ]; then
            echo "LibreWolf source cache hit; verifying cached archive..."
            if printf '%s  %s\n' "$SHA256" "$distfile" | sha256sum --check --status -; then
              cache_valid=true
            else
              echo "Cached source failed SHA-256 verification; refetching." >&2
            fi
          fi

          if [ "$cache_valid" != "true" ]; then
            rm -f -- "$distfile"
            echo "Fetching LibreWolf source through xbps-src..."
            ./xbps-src -A "$XBPS_TARGET_ARCH" fetch librewolf
          fi

          test -s "$distfile"
          printf '%s  %s\n' "$SHA256" "$distfile" | sha256sum --check -

      - name: save LibreWolf source
        if: ${{ steps.source-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: void-packages/hostdir/sources/librewolf-${{ steps.meta.outputs.version }}/${{ steps.meta.outputs.distfile }}
          key: librewolf-source-v4-${{ steps.meta.outputs.sha256 }}

      - name: build package
        timeout-minutes: 350
        working-directory: void-packages
        env:
          PGO_CACHE_HIT: ${{ steps.pgo-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          export PATH="/opt/xbps/usr/bin/:$PATH"

          if [ "$PGO_CACHE_HIT" != "true" ]; then
            pgo_runtime_dir="$PWD/hostdir/pgo-runtime"
            rm -rf "$pgo_runtime_dir"
            mkdir -p "$pgo_runtime_dir"
            chmod 700 "$pgo_runtime_dir"

            sway_pid=""
            sway_log="$pgo_runtime_dir/sway.log"
            cleanup_sway() {
              local status=$?
              trap - EXIT
              if [ -n "$sway_pid" ]; then
                kill "$sway_pid" >/dev/null 2>&1 || true
                wait "$sway_pid" >/dev/null 2>&1 || true
              fi
              if [ "$status" -ne 0 ] && [ -s "$sway_log" ]; then
                echo "Sway log (PGO compositor startup/runtime):" >&2
                cat "$sway_log" >&2
              fi
              rm -rf "$pgo_runtime_dir"
              exit "$status"
            }
            trap cleanup_sway EXIT

            printf '%s\n' \
              'output * mode 1366x768' \
              'default_border none' \
              'default_floating_border none' \
              >"$pgo_runtime_dir/sway.conf"

            # Weston 13's headless backend creates no wl_seat, which leaves GTK3
            # without a keyboard seat during profileserver.py. Sway/wlroots
            # supplies a seat even with no physical input devices. Pixman keeps
            # the compositor deterministic on GPU-less hosted runners.
            export XDG_RUNTIME_DIR="$pgo_runtime_dir"
            export WAYLAND_DISPLAY=wayland-1
            export XDG_CURRENT_DESKTOP=sway
            export XDG_SESSION_TYPE=wayland
            export WLR_BACKENDS=headless
            export WLR_RENDERER=pixman
            export WLR_LIBINPUT_NO_DEVICES=1
            export WLR_HEADLESS_OUTPUTS=1
            export WLR_NO_HARDWARE_CURSORS=1
            unset DISPLAY

            sway --config "$pgo_runtime_dir/sway.conf" --verbose \
              >"$sway_log" 2>&1 &
            sway_pid=$!

            for _ in $(seq 1 100); do
              if ! kill -0 "$sway_pid" 2>/dev/null; then
                echo "Sway exited before its Wayland socket became ready." >&2
                cat "$sway_log" >&2
                exit 1
              fi
              if [ -S "$pgo_runtime_dir/$WAYLAND_DISPLAY" ] &&
                 swaymsg -s "$pgo_runtime_dir/$WAYLAND_DISPLAY" -t get_version >/dev/null 2>&1; then
                break
              fi
              sleep 0.1
            done
            test -S "$pgo_runtime_dir/$WAYLAND_DISPLAY"
            swaymsg -s "$pgo_runtime_dir/$WAYLAND_DISPLAY" -t get_version >/dev/null
            : >"$pgo_runtime_dir/wayland-required"
          fi

          ./xbps-src -A "$XBPS_TARGET_ARCH" pkg -j"$(nproc)" librewolf

      - name: save LibreWolf PGO profile
        if: ${{ always() && steps.pgo-cache.outputs.cache-hit != 'true' && hashFiles('void-packages/hostdir/pgo-cache/merged.profdata') != '' && hashFiles('void-packages/hostdir/pgo-cache/jarlog') != '' }}
        uses: actions/cache/save@v6
        with:
          path: void-packages/hostdir/pgo-cache
          key: librewolf-pgo-${{ env.LIBREWOLF_PGO_CACHE_VERSION }}-${{ steps.meta.outputs.sha256 }}-${{ hashFiles('srcpkgs/librewolf/template', 'srcpkgs/librewolf/patches/**', '.github/workflows/main.yml', 'void-packages/srcpkgs/llvm22/template', 'void-packages/srcpkgs/rust/template', 'void-packages/srcpkgs/wasi-sdk/template', 'void-packages/srcpkgs/rust-sccache/template', 'void-packages/srcpkgs/base-chroot/template') }}

      - name: remove sccache credentials
        if: ${{ always() }}
        working-directory: void-packages
        run: rm -f hostdir/sccache-env

      - name: checksum packages
        working-directory: void-packages/hostdir/binpkgs/
        run: |
          set -euo pipefail
          compgen -G '*.xbps' >/dev/null || {
            echo "no XBPS packages were produced" >&2
            exit 1
          }
          compgen -G '*-repodata' >/dev/null || {
            echo "no repository metadata was produced" >&2
            exit 1
          }
          sha256sum -- *.xbps *-repodata
          sha512sum -- *.xbps *-repodata

      - name: publish release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.release_tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh auth setup-git

          # Published version tags are immutable; do not retarget existing releases.
          if existing_tag_sha="$(git ls-remote --exit-code origin "refs/tags/$TAG" | awk 'NR == 1 {print $1}')"; then
            if [ "$existing_tag_sha" != "$EXPECTED_SHA" ]; then
              echo "Refusing to overwrite tag $TAG: it points to $existing_tag_sha, expected $EXPECTED_SHA." >&2
              exit 1
            fi
            echo "Tag $TAG already points to this commit."
          else
            git push origin "$EXPECTED_SHA:refs/tags/$TAG"
          fi

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.release_tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          REV: ${{ steps.meta.outputs.rev }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" \
            --title "librewolf $TAG" \
            --notes "https://librewolf.dev/librewolf/source/releases/tag/${VERSION}-${REV}" \
            --latest=false

      - name: upload release assets
        working-directory: void-packages/hostdir/binpkgs/
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          set -euo pipefail

          # Keep already-published assets intact on retry.
          existing_assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for asset in *.xbps *-repodata; do
            [ -f "$asset" ] || continue
            if printf '%s\n' "$existing_assets" | grep -Fxq -- "$asset"; then
              echo "Keeping existing release asset: $asset"
            else
              gh release upload "$TAG" "$asset"
            fi
          done

      - name: mark release latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "${{ steps.meta.outputs.release_tag }}" --latest
