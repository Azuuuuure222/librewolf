name: build

on:
  push:
    branches:
      - master
    paths:
      - srcpkgs/librewolf/**
      - .github/workflows/main.yml
      - .github/scripts/**
  workflow_dispatch:
    inputs:
      pgo:
        description: "Try experimental PGO; a failed profile run falls back to LTO-only"
        required: false
        type: boolean
        default: false

concurrency:
  group: librewolf-${{ github.ref }}
  # Finish the active expensive build; newer pushes replace the single pending run.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version: ${{ steps.meta.outputs.version }}
      rev: ${{ steps.meta.outputs.rev }}
    runs-on: ${{ vars.LIBREWOLF_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      XBPS_TARGET_ARCH: x86_64-musl
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_VERSION: "librewolf-x86_64-musl-skylake-v1"
      LIBREWOLF_PGO_CACHE_VERSION: "v11"
    steps:
      - name: free space
        run: |
          set -euo pipefail
          available_kib=$(df --output=avail -k / | tail -1 | tr -d " ")
          if [ "$available_kib" -lt $((60 * 1024 * 1024)) ]; then
            echo "Less than 60 GiB available; reclaiming runner disk space..."
            sudo rm -rf -- \
              /usr/share/dotnet \
              /usr/share/swift \
              /usr/local/lib/android \
              /opt/ghc \
              /usr/local/.ghcup \
              /usr/local/share/boost \
              /usr/local/graalvm \
              /usr/local/share/powershell \
              /usr/local/share/chromium \
              /usr/local/lib/node_modules
            if command -v docker >/dev/null 2>&1; then
              sudo docker image prune --all --force
            fi
          else
            echo "Skipping runner cleanup; sufficient free space is already available."
          fi
          df -h /

      - name: checkout librewolf-void
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: checkout void-packages
        uses: actions/checkout@v7
        with:
          repository: void-linux/void-packages
          ref: master
          path: void-packages
          persist-credentials: false

      - name: overlay LibreWolf package into void-packages
        run: |
          set -euo pipefail
          rm -rf void-packages/srcpkgs/librewolf
          cp -a srcpkgs/librewolf void-packages/srcpkgs/librewolf

      - name: validate and prepare package metadata
        id: meta
        run: |
          set -euo pipefail
          bash -n .github/scripts/validate-template.sh
          bash .github/scripts/validate-template.sh srcpkgs/librewolf/template

      - name: restore LibreWolf PGO profile
        if: ${{ inputs.pgo == true }}
        id: pgo-cache
        uses: actions/cache/restore@v6
        with:
          path: void-packages/hostdir/pgo-cache
          # PGO validity follows source + downstream patches + this explicit version.
          # Bump LIBREWOLF_PGO_CACHE_VERSION when profile-relevant build/workload inputs change.
          key: librewolf-pgo-${{ env.LIBREWOLF_PGO_CACHE_VERSION }}-${{ steps.meta.outputs.sha256 }}-${{ hashFiles('srcpkgs/librewolf/template', 'srcpkgs/librewolf/patches/**', 'srcpkgs/librewolf/files/stab.h', 'void-packages/srcpkgs/llvm22/template', 'void-packages/srcpkgs/rust/template', 'void-packages/srcpkgs/cargo/template', 'void-packages/srcpkgs/wasi-sdk/template', 'void-packages/srcpkgs/rust-sccache/template', 'void-packages/srcpkgs/base-chroot/template') }}

      - name: prepare xbps-static
        run: |
          set -euo pipefail
          mkdir -p /opt/xbps
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 300 \
            --output xbps-static-latest.x86_64-musl.tar.xz \
            https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz
          tar -xJf xbps-static-latest.x86_64-musl.tar.xz -C /opt/xbps
          rm -f xbps-static-latest.x86_64-musl.tar.xz

      - name: allow xbps user namespaces
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: restore Void binary package cache
        id: xbps-cache
        uses: actions/cache/restore@v6
        with:
          path: void-packages/hostdir/repocache-${{ env.XBPS_TARGET_ARCH }}
          key: void-repocache-v2-${{ env.XBPS_TARGET_ARCH }}-${{ hashFiles('void-packages/xbps-src', 'void-packages/srcpkgs/base-chroot/template') }}

      - name: bootstrap xbps-src
        timeout-minutes: 15
        working-directory: void-packages
        run: |
          set -euo pipefail
          export PATH="/opt/xbps/usr/bin/:$PATH"
          ./xbps-src -A "$XBPS_TARGET_ARCH" binary-bootstrap

      - name: prepare sccache environment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const cacheUrl = process.env.ACTIONS_RESULTS_URL;
            const runtimeToken = process.env.ACTIONS_RUNTIME_TOKEN;
            if (!cacheUrl || !runtimeToken) {
              throw new Error("GitHub Actions cache runtime credentials are unavailable");
            }

            core.setSecret(runtimeToken);

            const quote = (value) => "'" + value.replaceAll("'", "'\"'\"'") + "'";
            const envFile = path.join(
              process.env.GITHUB_WORKSPACE,
              "void-packages",
              "hostdir",
              "sccache-env",
            );

            fs.writeFileSync(
              envFile,
              [
                `export SCCACHE_GHA_ENABLED=${quote(process.env.SCCACHE_GHA_ENABLED)}`,
                `export SCCACHE_GHA_VERSION=${quote(process.env.SCCACHE_GHA_VERSION)}`,
                `export ACTIONS_RESULTS_URL=${quote(cacheUrl)}`,
                `export ACTIONS_RUNTIME_TOKEN=${quote(runtimeToken)}`,
                "export SCCACHE_MULTILEVEL_CHAIN=disk,gha",
                "export SCCACHE_MULTILEVEL_WRITE_ERROR_POLICY=ignore",
              ].join("\n") + "\n",
              { mode: 0o600 },
            );
            fs.chmodSync(envFile, 0o600);
            core.info(`prepared ${envFile}`);

      - name: restore LibreWolf source
        id: source-cache
        uses: actions/cache/restore@v6
        with:
          path: void-packages/hostdir/sources/librewolf-${{ steps.meta.outputs.version }}/${{ steps.meta.outputs.distfile }}
          key: librewolf-source-v5-${{ steps.meta.outputs.sha256 }}

      - name: fetch and verify LibreWolf source
        timeout-minutes: 20
        working-directory: void-packages
        env:
          DISTFILE: ${{ steps.meta.outputs.distfile }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
        run: |
          set -euo pipefail
          export PATH="/opt/xbps/usr/bin/:$PATH"
          srcdir="hostdir/sources/librewolf-${VERSION}"
          distfile="${srcdir}/${DISTFILE}"
          mkdir -p "$srcdir"

          cache_valid=false
          if [ "${{ steps.source-cache.outputs.cache-hit }}" = "true" ] && [ -s "$distfile" ]; then
            echo "LibreWolf source cache hit; verifying cached archive..."
            if printf '%s  %s\n' "$SHA256" "$distfile" | sha256sum --check --status -; then
              cache_valid=true
            else
              echo "Cached source failed SHA-256 verification; refetching." >&2
            fi
          fi

          if [ "$cache_valid" != "true" ]; then
            rm -f -- "$distfile"
            echo "Fetching LibreWolf source through xbps-src..."
            ./xbps-src -A "$XBPS_TARGET_ARCH" fetch librewolf
          fi

          test -s "$distfile"
          printf '%s  %s\n' "$SHA256" "$distfile" | sha256sum --check -

      - name: save LibreWolf source
        if: ${{ steps.source-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: void-packages/hostdir/sources/librewolf-${{ steps.meta.outputs.version }}/${{ steps.meta.outputs.distfile }}
          key: librewolf-source-v5-${{ steps.meta.outputs.sha256 }}

      - name: build package
        timeout-minutes: 350
        working-directory: void-packages
        env:
          PGO_BUILD: ${{ inputs.pgo || false }}
        run: |
          set -euo pipefail
          export PATH="/opt/xbps/usr/bin/:$PATH"

          # Reserve 2 GiB for the OS/linker overhead and budget about 3 GiB per worker.
          cpu_jobs="$(nproc)"
          available_kib="$(awk '/^MemAvailable:/ { print $2; exit }' /proc/meminfo)"
          reserved_kib=$((2 * 1024 * 1024))
          per_job_kib=$((3 * 1024 * 1024))
          if [ "$available_kib" -gt "$reserved_kib" ]; then
            memory_jobs=$(((available_kib - reserved_kib) / per_job_kib))
          else
            memory_jobs=1
          fi
          [ "$memory_jobs" -ge 1 ] || memory_jobs=1
          build_jobs="$cpu_jobs"
          [ "$memory_jobs" -ge "$build_jobs" ] || build_jobs="$memory_jobs"

          echo "Build parallelism: $build_jobs jobs ($cpu_jobs CPUs, $((available_kib / 1024)) MiB available RAM)."
          pgo_options=()
          if [ "${PGO_BUILD:-false}" = "true" ]; then
            pgo_options=(-o pgo)
            echo "Experimental PGO enabled for this manually dispatched build."
          else
            echo "Using the reliable LTO-only default; PGO is opt-in."
          fi
          ./xbps-src -A "$XBPS_TARGET_ARCH" "${pgo_options[@]}" pkg -j"$build_jobs" librewolf

      - name: save LibreWolf PGO profile
        if: ${{ always() && inputs.pgo == true && steps.pgo-cache.outputs.cache-hit != 'true' && hashFiles('void-packages/hostdir/pgo-cache/merged.profdata') != '' && hashFiles('void-packages/hostdir/pgo-cache/jarlog') != '' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: void-packages/hostdir/pgo-cache
          key: librewolf-pgo-${{ env.LIBREWOLF_PGO_CACHE_VERSION }}-${{ steps.meta.outputs.sha256 }}-${{ hashFiles('srcpkgs/librewolf/template', 'srcpkgs/librewolf/patches/**', 'srcpkgs/librewolf/files/stab.h', 'void-packages/srcpkgs/llvm22/template', 'void-packages/srcpkgs/rust/template', 'void-packages/srcpkgs/cargo/template', 'void-packages/srcpkgs/wasi-sdk/template', 'void-packages/srcpkgs/rust-sccache/template', 'void-packages/srcpkgs/base-chroot/template') }}

      - name: save Void binary package cache
        if: ${{ always() && !cancelled() && steps.xbps-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: void-packages/hostdir/repocache-${{ env.XBPS_TARGET_ARCH }}
          key: void-repocache-v2-${{ env.XBPS_TARGET_ARCH }}-${{ hashFiles('void-packages/xbps-src', 'void-packages/srcpkgs/base-chroot/template') }}

      - name: remove sccache credentials
        if: ${{ always() }}
        working-directory: void-packages
        run: rm -f hostdir/sccache-env

      - name: checksum packages
        working-directory: void-packages/hostdir/binpkgs/
        run: |
          set -euo pipefail
          compgen -G '*.xbps' >/dev/null || {
            echo "no XBPS packages were produced" >&2
            exit 1
          }
          compgen -G '*-repodata' >/dev/null || {
            echo "no repository metadata was produced" >&2
            exit 1
          }
          sha256sum -- *.xbps *-repodata | tee SHA256SUMS
          sha512sum -- *.xbps *-repodata | tee SHA512SUMS

      - name: upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: librewolf-packages
          path: |
            void-packages/hostdir/binpkgs/*.xbps
            void-packages/hostdir/binpkgs/*-repodata
            void-packages/hostdir/binpkgs/SHA256SUMS
            void-packages/hostdir/binpkgs/SHA512SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    if: ${{ github.ref == 'refs/heads/master' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: download release bundle
        uses: actions/download-artifact@v4
        with:
          name: librewolf-packages
          path: binpkgs

      - name: publish release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release_tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh auth setup-git

          # Published version tags are immutable; do not retarget existing releases.
          if existing_tag_sha="$(git ls-remote --exit-code origin "refs/tags/$TAG" | awk 'NR == 1 {print $1}')"; then
            if [ "$existing_tag_sha" != "$EXPECTED_SHA" ]; then
              echo "Refusing to overwrite tag $TAG: it points to $existing_tag_sha, expected $EXPECTED_SHA." >&2
              exit 1
            fi
            echo "Tag $TAG already points to this commit."
          else
            git push origin "$EXPECTED_SHA:refs/tags/$TAG"
          fi

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release_tag }}
          VERSION: ${{ needs.build.outputs.version }}
          REV: ${{ needs.build.outputs.rev }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" \
            --title "librewolf $TAG" \
            --notes "https://librewolf.dev/librewolf/source/releases/tag/${VERSION}-${REV}" \
            --latest=false

      - name: upload release assets
        working-directory: binpkgs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail

          # Preserve existing release assets only if their bytes match this build.
          existing_assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          remote_asset_digests="$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.assets[] | [.name, (.digest // "")] | @tsv')"
          verify_dir="$(mktemp -d)"
          trap 'rm -rf -- "$verify_dir"' EXIT

          for asset in *.xbps *-repodata SHA256SUMS SHA512SUMS; do
            [ -f "$asset" ] || continue
            if printf '%s\n' "$existing_assets" | grep -Fxq -- "$asset"; then
              expected_digest="sha256:$(sha256sum -- "$asset" | awk '{print $1}')"
              actual_digest="$(printf '%s\n' "$remote_asset_digests" | awk -F '\t' -v name="$asset" '$1 == name {print $2; exit}')"
              if [ -z "$actual_digest" ]; then
                # Older GitHub assets may not expose a server-side digest.
                gh release download "$TAG" --dir "$verify_dir" --pattern "$asset"
                actual_digest="sha256:$(sha256sum -- "$verify_dir/$asset" | awk '{print $1}')"
                rm -f -- "$verify_dir/$asset"
              fi
              if [ "$actual_digest" != "$expected_digest" ]; then
                echo "Refusing to reuse $asset: published digest $actual_digest differs from this build $expected_digest." >&2
                exit 1
              fi
              echo "Verified existing release asset: $asset"
            else
              gh release upload "$TAG" "$asset"
            fi
          done

      - name: mark release latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "${{ needs.build.outputs.release_tag }}" --latest
